events {}
http {
    server {
        listen 80;
        server_name 46.250.234.91.sslip.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name 46.250.234.91.sslip.io;

        ssl_certificate /etc/letsencrypt/live/46.250.234.91.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/46.250.234.91.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3

        location /api/ {
            proxy_pass http://backend:6060;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

         location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
