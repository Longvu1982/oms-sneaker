services:
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    container_name: frontend-container
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:6060/api
    depends_on:
      - backend
    env_file:
      - ./app/frontend/.env

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: backend-container
    ports:
      - "6060:6060"
    depends_on:
      - db
    env_file:
      - ./app/backend/.env

  db:
    image: postgres:13
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: viet1223334444@seLLer2Kftu
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ~/backup:/backup

volumes:
  postgres-data:
